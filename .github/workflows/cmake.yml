name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "GCC", c: "gcc", cxx: "g++" }
          - { name: "Clang", c: "clang", cxx: "clang++" }
        build_type: [ "Debug", "Release" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenGL & X11 Dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgl1-mesa-dev
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          libxi-dev
          xvfb

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.c }}
          CXX: ${{ matrix.compiler.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DBUILD_GUI=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Test Suite (Unit + Integration + GUI)
        run: xvfb-run ctest --test-dir build --output-on-failure --verbose

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenGL & X11 Dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgl1-mesa-dev
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          libxi-dev
          xvfb

      - name: Configure with ASan & UBSan
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DBUILD_GUI=ON
          -DENABLE_SANITIZERS=ON

      - name: Build with Sanitizers
        run: cmake --build build-asan -j$(nproc)

      - name: Test under Sanitizers
        run: xvfb-run ctest --test-dir build-asan --output-on-failure
